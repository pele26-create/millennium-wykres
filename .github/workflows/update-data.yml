name: Automatyczna aktualizacja danych Stooq

on:
  schedule:
    - cron: '0 18 * * 1-5' # Uruchamiaj w dni robocze o 18:00 (po sesji)
  workflow_dispatch: # Pozwala też uruchomić ręcznie z zakładki Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v3

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Uruchom skrypt pobierający
        run: python fetch_data.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Automatyczna aktualizacja wycen [skip ci]" || exit 0
          git push
